<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Resume Analyzer Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Resume Analyzer Dashboard</h1>
      <p>Upload multiple resumes (PDF / DOCX). Results will be anonymized and ranked.</p>
    </header>

    <section class="uploader">
      <input id="resumeFiles" type="file" accept=".pdf,.docx,.txt" multiple />
      <button id="analyzeBtn">Analyze All Resumes</button>
      <div id="status"></div>
    </section>

    <section class="table-wrap">
      <table id="candidatesTable">
        <thead>
          <tr>
            <th>Candidate</th>
            <th>Score</th>
            <th>Rank</th>
            <th>Pass/Fail</th>
            <th>Download</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="candidatesBody">
          <!-- rows inserted here -->
        </tbody>
      </table>
    </section>
  </div>

  <!-- Modal for details -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
